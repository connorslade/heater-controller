[package]
name = "embeded"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32c011f4", "time-driver-any", "memory-x"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "tick-hz-32_768"] }
micromath = "2.1.0"
uom = { version = "0.38.0", default-features = false, features = ["si", "autoconvert", "f32"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = 2
