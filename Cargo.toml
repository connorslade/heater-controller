[package]
name = "embeded"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
# defmt = "1.1.1"
# defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32c011f4", "time-driver-any", "memory-x"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
micromath = "2.1.0"
ssd1306 = { version = "0.10.0", default-features = false }

[build-dependencies]
bitvec = "1.1.1"
image = "0.25.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = 2
